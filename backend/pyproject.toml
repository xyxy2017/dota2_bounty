[project]
name = "dota2-bounty-backend"
version = "0.1.0"
description = "Local background process MVP for Dota 2 historical player tracking"
requires-python = ">=3.11"
dependencies = [
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

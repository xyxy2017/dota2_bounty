<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dota2 调试导航</title>
    <style>
      body {
        margin: 0;
        background: #08111f;
        color: #e8f2ff;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 28px 18px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 34px;
      }
      p {
        margin: 0;
        color: #9ab0ca;
        line-height: 1.6;
      }
      .row {
        display: grid;
        gap: 14px;
        margin-top: 18px;
      }
      a.card {
        display: block;
        text-decoration: none;
        color: inherit;
        border: 1px solid #29415f;
        border-radius: 8px;
        padding: 16px;
        background: rgba(13, 24, 43, 0.86);
      }
      a.card:hover {
        border-color: #76f7b7;
      }
      .title {
        font-weight: 700;
        font-size: 18px;
      }
      .desc {
        margin-top: 6px;
        color: #9ab0ca;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 16px;
      }
      .links a {
        color: #76f7b7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dota2 调试导航</h1>
      <p>这里集中放 OCR、GSI 直接 ID 探针和主提醒页面。网页截图 OCR 与后端自动 OCR 已拆分，避免配置混在一起。</p>
      <div class="row">
        <a class="card" href="/debug/ocr/web">
          <div class="title">网页截图 OCR</div>
          <div class="desc">浏览器手动选择 Dota2 窗口，适合调裁剪区域、前端 OCR 参数和人工对比。</div>
        </a>
        <a class="card" href="/debug/ocr/auto-ui">
          <div class="title">后端自动 OCR</div>
          <div class="desc">后端自动找 Dota2 窗口并截图识别，支持 slot 模式、debug 留档、状态与进度显示。</div>
        </a>
        <a class="card" href="/debug/gsi/id-probe-ui">
          <div class="title">GSI 玩家 ID 探针</div>
          <div class="desc">实测当前对局 GSI 原始包里是否出现其他玩家 account_id / steamId，并保存原始 payload 供复盘。</div>
        </a>
      </div>
      <div class="links">
        <a href="/">返回主页面</a>
        <a href="/debug/gsi/id-probe">查看探针 JSON</a>
        <a href="/debug/ocr/status">查看 OCR 状态 JSON</a>
      </div>
    </main>
  </body>
</html>
